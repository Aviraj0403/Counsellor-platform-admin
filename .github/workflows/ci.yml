name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check:architecture
      - run: npm run check:theme # one theming rule for light/dark mode, see docs/THEMING.md
      - run: npm run check:i18n # every language has the same keys
      - run: npm run build
